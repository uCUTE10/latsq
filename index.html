<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latin Square Solver</title>
<style>
  :root {
    --bg: #f6f7f9; --ink: #1d2433; --line: #b9c0cc; --cell: #ffffff;
    --given: #1d2433; --solved: #2457c5; --bad: #fde3e3; --bad-ink: #b3261e;
    --btn: #1d2433; --btn-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --ink: #e8ebf1; --line: #3b4352; --cell: #1d222b;
      --given: #e8ebf1; --solved: #7fa6ff; --bad: #4a2224; --bad-ink: #ff8a80;
      --btn: #e8ebf1; --btn-ink: #14171d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif; padding: 24px;
  }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 600; }
  p.sub { margin: 0 0 18px; color: color-mix(in srgb, var(--ink) 65%, transparent); font-size: .95rem; line-height: 1.45; }

  .sizes { display: flex; gap: 0; margin-bottom: 18px; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
  .sizes label { flex: 1; text-align: center; cursor: pointer; }
  .sizes input { position: absolute; opacity: 0; pointer-events: none; }
  .sizes span { display: block; padding: 10px; font-weight: 600; }
  .sizes input:checked + span { background: var(--btn); color: var(--btn-ink); }
  .sizes input:focus-visible + span { outline: 3px solid var(--solved); outline-offset: -3px; }

  #grid { display: grid; gap: 6px; margin-bottom: 18px; }
  #grid input {
    width: 100%; aspect-ratio: 1; text-align: center; font: 600 var(--fs, 1.6rem) Georgia, serif;
    color: var(--given); background: var(--cell);
    border: 2px solid var(--line); border-radius: 6px; padding: 0; caret-color: transparent;
  }
  #grid input:focus { outline: 3px solid var(--solved); outline-offset: 1px; }
  #grid input.solved { color: var(--solved); font-weight: 400; }
  #grid input.bad { background: var(--bad); border-color: var(--bad-ink); color: var(--bad-ink); }

  .row { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 12px; font: 600 1rem Georgia, serif; cursor: pointer;
    border-radius: 6px; border: 2px solid var(--btn); background: var(--btn); color: var(--btn-ink);
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:focus-visible { outline: 3px solid var(--solved); outline-offset: 2px; }
  #msg { min-height: 3em; margin-top: 16px; font-size: .95rem; line-height: 1.45; }
  #msg.err { color: var(--bad-ink); }
</style>
</head>
<body>
<main>
  <h1>Latin square solver</h1>
  <p class="sub" id="sub"></p>

  <div class="sizes" role="radiogroup" aria-label="Grid size">
    <label><input type="radio" name="size" value="5" checked><span>5×5</span></label>
    <label><input type="radio" name="size" value="6"><span>6×6</span></label>
  </div>

  <div id="grid" role="grid"></div>

  <div class="row">
    <button id="solve">Solve</button>
    <button id="clearSolved" class="ghost">Remove solved</button>
    <button id="clearAll" class="ghost">Clear all</button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script>
(function () {
  var N = 5;
  var gridEl = document.getElementById('grid');
  var msg = document.getElementById('msg');
  var sub = document.getElementById('sub');
  var cells = [];
  var saved = {}; // keeps each size's grid when you switch

  function say(text, isErr) { msg.textContent = text; msg.className = isErr ? 'err' : ''; }

  function save() {
    saved[N] = cells.map(function (c) { return { v: c.value, s: c.classList.contains('solved') }; });
  }

  function build(n) {
    N = n;
    gridEl.innerHTML = '';
    gridEl.style.gridTemplateColumns = 'repeat(' + N + ', 1fr)';
    gridEl.style.setProperty('--fs', N === 5 ? '1.7rem' : '1.5rem');
    gridEl.setAttribute('aria-label', N + ' by ' + N + ' Latin square');
    sub.textContent = 'Type a digit from 1 to ' + N + ' in any cell. Each digit must appear once in every row and column. Press Solve to fill in the rest.';
    cells = [];
    for (var i = 0; i < N * N; i++) {
      var inp = document.createElement('input');
      inp.type = 'text'; inp.inputMode = 'numeric'; inp.maxLength = 1; inp.autocomplete = 'off';
      inp.setAttribute('aria-label', 'Row ' + (Math.floor(i / N) + 1) + ', column ' + (i % N + 1));
      inp.dataset.i = i;
      if (saved[N] && saved[N][i]) {
        inp.value = saved[N][i].v;
        if (saved[N][i].s) inp.classList.add('solved');
      }
      gridEl.appendChild(inp);
      cells.push(inp);
    }
    mark(); say('');
  }

  function read() {
    return cells.map(function (c) { return c.value ? parseInt(c.value, 10) : 0; });
  }

  function conflicts(g) {
    var bad = {};
    for (var a = 0; a < N * N; a++) {
      if (!g[a]) continue;
      for (var b = a + 1; b < N * N; b++) {
        var sameRow = Math.floor(a / N) === Math.floor(b / N);
        var sameCol = a % N === b % N;
        if (g[a] === g[b] && (sameRow || sameCol)) { bad[a] = true; bad[b] = true; }
      }
    }
    return bad;
  }

  function mark() {
    var bad = conflicts(read());
    cells.forEach(function (c, i) { c.classList.toggle('bad', !!bad[i]); });
    return Object.keys(bad).length > 0;
  }

  function ok(g, pos, d) {
    var r = Math.floor(pos / N), c = pos % N;
    for (var k = 0; k < N; k++) {
      if (g[r * N + k] === d || g[k * N + c] === d) return false;
    }
    return true;
  }

  // Backtracking: always fills the empty cell with the fewest options. Stops after 2 solutions.
  function solve(g, state) {
    var best = -1, bestOpts = null;
    for (var p = 0; p < N * N; p++) {
      if (g[p]) continue;
      var opts = [];
      for (var d = 1; d <= N; d++) if (ok(g, p, d)) opts.push(d);
      if (opts.length === 0) return;
      if (bestOpts === null || opts.length < bestOpts.length) { best = p; bestOpts = opts; }
    }
    if (best === -1) {
      state.count++;
      if (state.count === 1) state.first = g.slice();
      return;
    }
    for (var i = 0; i < bestOpts.length; i++) {
      g[best] = bestOpts[i];
      solve(g, state);
      g[best] = 0;
      if (state.count >= 2) return;
    }
  }

  function removeSolved() {
    cells.forEach(function (c) {
      if (c.classList.contains('solved')) { c.value = ''; c.classList.remove('solved'); }
    });
  }

  document.getElementById('solve').addEventListener('click', function () {
    removeSolved();
    if (mark()) { say('Some digits repeat in a row or column (shown in red). Fix them, then solve again.', true); return; }
    var g = read();
    var given = g.filter(Boolean).length;
    var state = { count: 0, first: null };
    solve(g, state);
    if (state.count === 0) { say('No Latin square fits these digits. Change or remove one and try again.', true); return; }
    cells.forEach(function (c, i) {
      if (!c.value) { c.value = state.first[i]; c.classList.add('solved'); }
    });
    if (given === N * N) say('Your grid is a valid Latin square.');
    else if (state.count === 1) say('Solved. This is the only Latin square that fits your digits.');
    else say('Solved. More than one Latin square fits your digits, so this is one possible answer. Add more digits to narrow it down.');
  });

  document.getElementById('clearSolved').addEventListener('click', function () {
    removeSolved(); mark(); say('');
  });

  document.getElementById('clearAll').addEventListener('click', function () {
    cells.forEach(function (c) { c.value = ''; c.classList.remove('solved', 'bad'); });
    say(''); cells[0].focus();
  });

  document.querySelectorAll('input[name="size"]').forEach(function (r) {
    r.addEventListener('change', function () {
      save();
      build(parseInt(r.value, 10));
    });
  });

  gridEl.addEventListener('input', function (e) {
    var c = e.target;
    c.value = c.value.replace(new RegExp('[^1-' + N + ']', 'g'), '').slice(0, 1);
    c.classList.remove('solved');
    mark(); say('');
  });

  gridEl.addEventListener('focusin', function (e) { e.target.select(); });

  gridEl.addEventListener('keydown', function (e) {
    var i = parseInt(e.target.dataset.i, 10), t = null;
    if (e.key === 'ArrowRight' && i % N < N - 1) t = i + 1;
    else if (e.key === 'ArrowLeft' && i % N > 0) t = i - 1;
    else if (e.key === 'ArrowDown' && i < N * (N - 1)) t = i + N;
    else if (e.key === 'ArrowUp' && i >= N) t = i - N;
    else if (e.key === 'Backspace' || e.key === 'Delete') {
      e.target.value = ''; e.target.classList.remove('solved'); mark(); e.preventDefault(); return;
    }
    if (t !== null) { e.preventDefault(); cells[t].focus(); }
  });

  build(5);
})();
</script>
</body>
</html>
